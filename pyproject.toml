[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lmsgrab"
version = "0.2.0"
description = "Use your Moodle LMS from one command: grab lectures sorted, fetch new ones, submit work."
readme = "README.md"
requires-python = ">=3.8"
dependencies = []  # pure standard library, nothing to install

[project.scripts]
lms = "lmsgrab.cli:main"
lms-mcp = "lmsgrab.mcp_server:main"

[tool.setuptools]
packages = ["lmsgrab"]
